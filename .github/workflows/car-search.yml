name: car-search

on:
  schedule:
    # Every 2 hours (keeps Jina token usage low; 2h freshness is plenty for car hunting).
    # GitHub may delay scheduled runs under load; this is best-effort.
    - cron: '0 */2 * * *'
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Prevent overlapping runs from racing on the committed state file.
concurrency:
  group: car-search
  cancel-in-progress: false

permissions:
  contents: write # needed to commit state/seen.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check for new listings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: npm start

      - name: Persist seen state
        run: |
          if [[ -n "$(git status --porcelain state/seen.json)" ]]; then
            git config user.name "car-search-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/seen.json
            git commit -m "chore: update seen listings [skip ci]"
            git push
          else
            echo "No state changes to persist."
          fi
