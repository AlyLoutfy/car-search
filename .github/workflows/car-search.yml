name: car-search

on:
  schedule:
    # Every hour. Fetches go straight to the sites now — nothing metered to conserve — so the only
    # cost is a runner minute. GitHub may delay scheduled runs under load; this is best-effort.
    - cron: '0 * * * *'
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Prevent overlapping runs from racing on the committed state file.
concurrency:
  group: car-search
  cancel-in-progress: false

permissions:
  contents: write # needed to commit state/seen.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check for new listings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start

      - name: Persist seen state
        run: |
          if [[ -n "$(git status --porcelain state/seen.json)" ]]; then
            git config user.name "car-search-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/seen.json
            git commit -m "chore: update seen listings [skip ci]"
            git push
          else
            echo "No state changes to persist."
          fi
