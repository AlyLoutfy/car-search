name: nike-watch

on:
  schedule:
    # Every 10 minutes. NOTE: GitHub delays/skips scheduled runs under load, so this is
    # best-effort — fine for a restock watch, not guaranteed to catch a flash sell-out.
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Prevent overlapping runs from racing on the committed state file.
concurrency:
  group: nike-watch
  cancel-in-progress: false

permissions:
  contents: write # needed to commit state/nike.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check Nike stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run nike

      - name: Persist nike state
        run: |
          if [[ -n "$(git status --porcelain state/nike.json)" ]]; then
            git config user.name "car-search-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/nike.json
            git commit -m "chore: update nike stock state [skip ci]"
            git push
          else
            echo "No state changes to persist."
          fi
